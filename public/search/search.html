<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Search Tests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background: linear-gradient(120deg, #eaf6ff 0%, #b6e0fe 100%);
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .search-container {
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 8px 32px rgba(33,150,243,0.10), 0 2px 8px rgba(0,0,0,0.06);
        padding: 44px 32px 32px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 320px;
        max-width: 95vw;
        width: 100%;
      }
      .search-title {
        font-size: 2em;
        font-weight: 700;
        color: #1769aa;
        margin-bottom: 28px;
        text-align: center;
        letter-spacing: 1px;
      }
      .search-bar-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 350px;
        gap: 12px;
        margin-bottom: 18px;
      }
      .search-input {
        width: 100%;
        padding: 12px;
        border: 1.5px solid #c3e0f7;
        border-radius: 10px;
        background: #f7fbff;
        font-size: 16px;
        transition: border 0.2s;
      }
      .search-input:focus {
        border-color: #2196f3;
        outline: none;
      }
      .btn-container {
        display: flex;
        gap: 10px;
        width: 100%;
        justify-content: center;
      }
      .search-btn {
        background: #2196f3;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .search-btn:hover {
        background: #1769aa;
      }
      .btn-home {
        background: #fff;
        color: #2196f3;
        border: 1.5px solid #2196f3;
        border-radius: 10px;
        padding: 12px 28px;
        font-size: 1em;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      .btn-home:hover {
        background: #2196f3;
        color: #fff;
      }
      #exam-result {
        width: 100%;
        margin-top: 32px;
        display: flex;
        justify-content: center;
      }
      @media (max-width: 600px) {
        body {
          padding: 0;
        }
        .search-container {
          padding: 18px 4vw;
          min-width: unset;
          max-width: 100vw;
        }
        .search-title {
          font-size: 1.15em;
          margin-bottom: 18px;
        }
        .search-bar-group {
          max-width: 100vw;
          gap: 10px;
        }
        .search-input {
          font-size: 1em;
          padding: 10px;
          width: 100%;
        }
        .btn-container {
          flex-direction: column;
          gap: 8px;
          width: 100%;
        }
        .search-btn,
        .btn-home {
          width: 100%;
          font-size: 1em;
          padding: 10px 0;
        }
        #exam-result > div {
          max-width: 98vw !important;
          padding: 16px 6vw !important;
        }
      }
    </style>
  </head>
  <body>
    <div style="text-align:center; margin-bottom:18px;">

    </div>
    <div class="search-container">
      <div class="search-title">Search Tests</div>
      <form class="search-bar-group" id="search-form">
        <input
          class="search-input"
          type="text"
          placeholder="Enter test name or keyword..."
          required
        />
        <div class="btn-container">
          <button class="search-btn" type="submit">Go</button>
          
          <button class="btn-home" type="button" onclick="window.location.href='/page.html'">Go to Homepage</button>
                <button
        onclick="window.location.href='/documentation/attempt.html'"
        style="
          background: #1769aa;
          color: #fff;
          border: none;
          border-radius: 10px;
          padding: 12px 32px;
          font-size: 1em;
          font-weight: 700;
          cursor: pointer;
          transition: background 0.2s;
          margin-top: 18px;
        "
      >
        How to Attempt
      </button>
        </div>
      </form>
      <div id="exam-result"></div>
    </div>

    <script>
      document
        .getElementById("search-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const input = document.querySelector(".search-input");
          const testName = input.value.trim();
          const resultDiv = document.getElementById("exam-result");
          resultDiv.innerHTML = "";
          if (!testName) return;

          fetch(`/api/examByName/${encodeURIComponent(testName)}`)
            .then((res) => res.json())
            .then((data) => {
              if (data.error) {
                resultDiv.innerHTML = `<div style="color:#ef4444;text-align:center;">Test not found!</div>`;
              } 
              else if(data.isLive === false) {
                resultDiv.innerHTML = `<div style="color:#ef4444;text-align:center;">Test is not live!</div>`;
              } else {  
                localStorage.removeItem("name");
                localStorage.setItem("name", data.name);
                resultDiv.innerHTML = `
          <div style="
            background:#f1f5f9;
            border-radius:14px;
            box-shadow:0 2px 8px rgba(33,150,243,0.06);
            padding:24px 20px;
            margin:0 auto;
            max-width:400px;
            border:1px solid #e2e8f0;
            display:flex;
            flex-direction:column;
            gap:10px;
            align-items:center;
          ">
            <div style="font-size:1.2em;font-weight:600;color:#1e293b;">${
              data.name
            }</div>
            <div style="font-size:1em;color:#334155;">Description: ${
              data.description || "N/A"
            }</div>
            <div style="font-size:0.98em;color:#334155;">Date: ${new Date(
              data.date
            ).toLocaleString()}</div>
            <div style="font-size:0.98em;color:#334155;">Cheat Attempts Allowed: ${
              data.cheatCount
            }</div>
            <div style="font-size:0.98em;color:#334155;">Keyboard Allowed: ${
              data.AllowingKeyboard ? "Yes" : "No"
            }</div>
            <button class="search-btn" style="margin-top:18px;" onclick="window.location.href='/index.html?id=${
              data._id
            }'">Attempt</button>
          </div>
        `;
              }
            })
            .catch(() => {
              resultDiv.innerHTML = `<div style="color:#ef4444;text-align:center;">Error searching for test.</div>`;
            });
        });
    </script>
  </body>
</html>
