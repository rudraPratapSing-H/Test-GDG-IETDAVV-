<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background: linear-gradient(120deg, #eaf6ff 0%, #b6e0fe 100%);
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        max-width: 480px;
        width: 100%;
        margin: 32px 0;
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 8px 32px rgba(33, 150, 243, 0.1),
          0 2px 8px rgba(0, 0, 0, 0.06);
        padding: 40px 28px 28px 28px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .form-title {
        font-weight: 800;
        color: #1769aa;
        margin-bottom: 22px;
        text-align: center;
        font-size: 2em;
        letter-spacing: 1px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .form-section {
        margin-bottom: 18px;
      }
      .form-label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #334155;
        font-size: 1em;
      }
      .form-input,
      .form-textarea,
      .form-select {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 8px;
        border: 1.5px solid #c3e0f7;
        border-radius: 10px;
        background: #f7fbff;
        font-size: 16px;
        transition: border 0.2s;
      }
      .form-input:focus,
      .form-textarea:focus,
      .form-select:focus {
        border-color: #2196f3;
        outline: none;
      }
      .form-textarea {
        resize: vertical;
      }
      .form-button {
        background: #2196f3;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 14px 0;
        font-size: 1.08em;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
        transition: background 0.2s;
      }
      .form-button:hover {
        background: #1769aa;
      }
      .btn-home {
        background: #fff;
        color: #2196f3;
        border: 1.5px solid #2196f3;
        border-radius: 10px;
        padding: 12px 0;
        font-size: 1em;
        font-weight: 600;
        width: 100%;
        margin-top: 10px;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      .btn-home:hover {
        background: #2196f3;
        color: #fff;
      }
      .optional {
        font-size: 12px;
        color: #888;
        font-style: italic;
        margin-left: 2px;
      }
      .required {
        color: #d32f2f;
        margin-left: 2px;
      }
      .timer-block {
        margin-bottom: 16px;
        background: #f7fbff;
        border-radius: 8px;
        padding: 12px 10px;
      }
      .timer-radio-group {
        display: flex;
        gap: 18px;
        margin-bottom: 10px;
      }
      .form-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }
      @media (max-width: 600px) {
        .container {
          padding: 16px 4vw;
          margin: 10px 0;
        }
        .form-title {
          font-size: 1.2em;
        }
        .form-input,
        .form-textarea,
        .form-select {
          font-size: 1em;
          padding: 10px 8px;
        }
        .form-button,
        .btn-home {
          font-size: 1em;
          padding: 10px 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-title">Create a New Test</div>
      <form>
        <div class="form-section">
          <div style="text-align: center; margin-bottom: 18px">
            <button
              onclick="window.location.href='/documentation/createTest.html'"
              style="
                background: #1769aa;
                color: #fff;
                border: none;
                border-radius: 10px;
                padding: 12px 32px;
                font-size: 1em;
                font-weight: 700;
                cursor: pointer;
                transition: background 0.2s;
                margin-top: 18px;
              "
            >
              Learn How to Create a Test
            </button>
          </div>
          <label class="form-label">
            Test Name <span class="required">*</span>
          </label>
          <input
            class="form-input"
            type="text"
            placeholder="Enter the test name"
            name="test-name"
            required
          />
        </div>

        <div class="form-section">
          <label class="form-label">
            Test Description <span class="optional">(optional)</span>
          </label>
          <textarea
            class="form-textarea"
            rows="2"
            placeholder="Brief description (optional)"
            name="test-description"
          ></textarea>
        </div>

        <div class="form-section">
          <label class="form-label">
            Questions (PDF or JSON) <span class="required">*</span>
          </label>
          <input
            class="form-input"
            type="file"
            accept=".pdf,application/pdf,.json,application/json"
            required
            name="json"
          />
        </div>

        <div class="form-section timer-block">
          <label class="form-label">
            Timer Type <span class="required">*</span>
          </label>
          <div class="timer-radio-group">
            <label>
              <input
                type="radio"
                name="timer-type"
                value="overall"
                required
                checked
                onclick="toggleTimerInputs()"
              />
              Overall Duration
            </label>
            <label>
              <input
                type="radio"
                name="timer-type"
                value="per-question"
                onclick="toggleTimerInputs()"
              />
              Per Question Timer
            </label>
          </div>
          <div id="overall-timer-block">
            <label class="form-label">
              Test Duration (minutes) <span class="required">*</span>
            </label>
            <input
              class="form-input"
              type="number"
              min="1"
              placeholder="Duration in minutes"
              id="overall-timer-input"
              required
            />
          </div>
          <div id="per-question-timer-block" style="display: none">
            <label class="form-label">
              Per Question Timer (seconds) <span class="required">*</span>
            </label>
            <input
              class="form-input"
              type="number"
              min="1"
              placeholder="Seconds per question"
              id="per-question-timer-input"
            />
          </div>
        </div>

        <div class="form-section">
          <label class="form-label">
            Maximum Allowed Cheat Count <span class="required">*</span>
          </label>
          <input
            class="form-input"
            type="number"
            min="0"
            placeholder="Max cheat count (e.g., 3)"
            name="cheat-count"
            required
          />
        </div>

        <div class="form-section">
          <label class="form-label">
            Allow Keyboard During Test? <span class="required">*</span>
          </label>
          <select class="form-select" required>
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>

        <div class="form-section">
          <label class="form-label">
            Rules <span class="optional">(optional)</span>
          </label>
          <textarea
            class="form-textarea"
            rows="2"
            placeholder="Any special rules (optional)"
          ></textarea>
        </div>

        <div class="form-section">
          <label class="form-label">
            Unique Code <span class="required">*</span>
          </label>
          <input
            class="form-input"
            type="text"
            placeholder="Enter a unique code for the test"
            name="unique-code"
            required
          />
        </div>

        <div class="form-actions">
          <button class="form-button" type="submit"   >Create Test</button>
          <button
            class="form-button"
            type="button"
            onclick="window.location.href='dashboard/dashboard.html'"
          >
            Go to Dashboard
          </button>
          <button
            class="btn-home"
            type="button"
            onclick="window.location.href='/page.html'"
          >
            Go to Homepage
          </button>
        </div>
      </form>
    </div>
    <script type="module" src="script2.js"></script>
    <script>
      function toggleTimerInputs() {
        const overallBlock = document.getElementById("overall-timer-block");
        const perQBlock = document.getElementById("per-question-timer-block");
        const overallInput = document.getElementById("overall-timer-input");
        const perQInput = document.getElementById("per-question-timer-input");
        const timerType = document.querySelector(
          'input[name="timer-type"]:checked'
        ).value;

        if (timerType === "overall") {
          overallBlock.style.display = "";
          perQBlock.style.display = "none";
          overallInput.required = true;
          perQInput.required = false;
          perQInput.value = "";
        } else {
          overallBlock.style.display = "none";
          perQBlock.style.display = "";
          overallInput.required = false;
          perQInput.required = true;
          overallInput.value = "";
        }
      }
      document.addEventListener("DOMContentLoaded", toggleTimerInputs);
    </script>
  </body>
</html>
