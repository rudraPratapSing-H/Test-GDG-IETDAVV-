<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f8fafc;
        margin: 0;
      }

      .dashboard-container {
        max-width: 900px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        padding: 36px 28px;
      }

      .test-list-title {
        font-size: 2em;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 24px;
        text-align: center;
      }

      .test-card {
        background: #f9fafb;
        border-radius: 14px;
        padding: 24px 20px;
        margin-bottom: 22px;
        border: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: all 0.25s ease-in-out;
      }

      .test-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      }

      .test-card.live {
        border-left: 6px solid #22c55e;
        background: #f0fdf4;
      }

      .test-card.killed {
        border-left: 6px solid #ef4444;
        background: #fef2f2;
        opacity: 0.9;
      }

      .test-title {
        font-size: 1.3em;
        font-weight: 600;
        color: #1e293b;
      }

      .test-meta {
        font-size: 0.95em;
        color: #334155;
      }

      /* Status badge */
      .status-badge {
        display: inline-block;
        padding: 4px 10px;
        font-size: 0.85em;
        border-radius: 6px;
        font-weight: 600;
      }

      .status-live {
        background: #dcfce7;
        color: #15803d;
      }

      .status-killed {
        background: #fee2e2;
        color: #b91c1c;
      }

      /* Buttons */
      .test-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .btn-delete,
      .btn-toggle {
        border: none;
        border-radius: 8px;
        padding: 8px 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
      }

      .btn-delete {
        background: #ef4444;
        color: #fff;
      }
      .btn-delete:hover {
        background: #b91c1c;
      }

      .btn-toggle {
        background: #0ea5e9;
        color: #fff;
      }
      .btn-toggle.live {
        background: #22c55e;
      }
      .btn-toggle.killed {
        background: #ef4444;
      }
      .btn-toggle:hover {
        filter: brightness(0.9);
      }
            .btn-home {
        display: inline-block;
        padding: 10px 24px;
        border: 2px solid #4285f4;
        color: #4285f4;
        border-radius: 8px;
        font-weight: 500;
        text-decoration: none;
        transition: 0.3s ease;
      }

      .btn-home:hover {
        background: #4285f4;
        color: white;
        transform: translateY(-2px);
      }

      /* Responsive */
      @media (max-width: 700px) {
        .dashboard-container {
          padding: 20px 10px;
        }
        .test-card {
          padding: 16px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <div class="test-list-title">Your Tests</div>
      <div id="test-list"></div>
        <button class="btn-home" onclick="window.location.href='/page.html'">Go to Homepage</button>

    </div>

    <script>
      const username = localStorage.getItem("username");
      const testList = document.getElementById("test-list");

      fetch("/api/getAllTests", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          username: username,
        },
      })
        .then((res) => res.json())
        .then((tests) => {
          if (!Array.isArray(tests) || tests.length === 0) {
            testList.innerHTML = "<p>No tests found.</p>";
            return;
          }
          testList.innerHTML = "";
          tests.forEach((test) => {
            const card = document.createElement("div");
            card.className = "test-card" + (test.isLive ? " live" : " killed");
            card.innerHTML = `
              <div class="test-title">${test.name}</div>
              <div class="test-meta">Description: ${test.description || "N/A"}</div>
              <div class="test-meta">Date: ${new Date(test.date).toLocaleString()}</div>
              <div class="test-meta">Cheat Attempts Allowed: ${test.cheatCount}</div>
              <div class="test-meta">Keyboard Allowed: ${test.AllowingKeyboard ? "Yes" : "No"}</div>
              <div class="test-meta">Google Sheet: <a href="${test.sheetUrl}" target="_blank">Open</a></div>
              <div class="test-meta">Status: <span class="status-badge ${test.isLive ? "status-live" : "status-killed"}">${test.isLive ? "Live" : "Killed"}</span></div>
              <div class="test-actions">
                <button class="btn-delete">Delete</button>
                <button class="btn-toggle ${test.isLive ? "live" : "killed"}">${test.isLive ? "Kill" : "Live"}</button>
              </div>
            `;
            card.querySelector(".btn-delete").onclick = () => {
              if (confirm("Are you sure you want to delete this test?")) {
                fetch(`/api/deleteTest/${test._id}`, { method: "DELETE" })
                  .then((res) => res.json())
                  .then((result) => {
                    if (result.success) card.remove();
                    else alert("Failed to delete test.");
                  });
              }
            };
            card.querySelector(".btn-toggle").onclick = () => {
              fetch(`/api/toggleLive/${test._id}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
              })
                .then((res) => res.json())
                .then((result) => {
                  if (result.success) {
                    test.isLive = !test.isLive;
                    card.className = "test-card" + (test.isLive ? " live" : " killed");
                    card.querySelector(".btn-toggle").textContent = test.isLive ? "Kill" : "Live";
                    card.querySelector(".btn-toggle").className = "btn-toggle " + (test.isLive ? "live" : "killed");
                    const statusBadge = card.querySelector(".status-badge");
                    statusBadge.textContent = test.isLive ? "Live" : "Killed";
                    statusBadge.className = "status-badge " + (test.isLive ? "status-live" : "status-killed");
                  } else {
                    alert("Failed to update test status.");
                  }
                });
            };
            testList.appendChild(card);
          });
        });
    </script>
  </body>
</html>
