<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <style>
        body {
            background: #eaf6ff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 48px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 320px;
        }
        h1 {
            font-size: 2em;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 32px;
            text-align: center;
        }
        .main-btn {
            margin: 12px 0;
            padding: 14px 36px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: #2196f3;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
            width: 220px;
        }
        .main-btn:hover {
            background: #1769aa;
        }
        @media (max-width: 600px) {
            .main-container {
                padding: 24px 8px;
                min-width: unset;
            }
            h1 {
                font-size: 1.3em;
            }
            .main-btn {
                width: 100%;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Welcome to the Test</h1>
        <button class="main-btn" onclick="window.location.href='search/search.html'">Attempt Test</button>
        <button class="main-btn" onclick="window.location.href='login.html'">Create Test</button>
    </div>
</body>
</html>
